<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  :root {
    --bg:     #0d0d0d;
    --text:   #ffffff;
    --text2:  #c4c9ac;
    --accent: #c3f400;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  .mark {
    position: relative;
    margin-bottom: 18px; line-height: 0;
    animation: pulse-mark 3s ease-in-out infinite;
    transform-origin: center;
  }
  .mark svg { filter: drop-shadow(4px 4px 0px #000000); }
  .mark-glow {
    position: absolute; inset: -30px;
    background: radial-gradient(circle, rgba(195,244,0,0.20) 0%, transparent 70%);
    z-index: -1;
  }
  @keyframes pulse-mark {
    0%, 100% { transform: scale(1);    opacity: 1;    }
    50%      { transform: scale(1.04); opacity: 0.88; }
  }
  .badge {
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: var(--text2); text-transform: uppercase;
    margin-bottom: 14px;
  }
  .title {
    font-size: 32px; font-weight: 800; letter-spacing: -1px;
    color: var(--text); text-align: center; line-height: 1.1;
    text-shadow: 0 0 18px rgba(195,244,0,0.55);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 11px; font-weight: 600; letter-spacing: 3px;
    color: #888888; text-transform: uppercase;
    margin-bottom: 30px;
  }
  .dots { display: flex; gap: 8px; }
  .dots span {
    width: 7px; height: 7px;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1);    }
  }
</style>
</head>
<body>
  <div class="mark">
    <div class="mark-glow"></div>
    <svg width="56" height="56" viewBox="0 0 32 32">
      <rect x="6" y="16" width="20" height="10" fill="#c3f400"></rect>
      <rect x="6" y="6" width="20" height="20" fill="none" stroke="#c3f400" stroke-width="2.6"></rect>
    </svg>
  </div>
  <div class="title">QUANT_CORE</div>
  <div class="badge">Smart Money Concepts</div>
  <div class="subtitle">by TheEoneYedWonder</div>
  <div class="dots"><span></span><span></span><span></span></div>
</body>
</html>
