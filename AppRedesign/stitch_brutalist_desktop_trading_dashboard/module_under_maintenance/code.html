<style>
        body {
            background-color: #0e0e0e; /* surface-container-lowest */
            color: #e5e2e1; /* on-background */
        }
        
        .brutal-border {
            border: 2px solid #1c1b1b; /* outline-variant approximation */
        }
        
        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px #000000;
        }
        
        .brutal-shadow-accent {
            box-shadow: 4px 4px 0px 0px #c3f400; /* primary-fixed */
        }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(14px);
            border: 2px solid #1c1b1b;
        }
        
        /* Scanline effect for terminal feel */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        /* Subtle pulsing glow for the warning icon */
        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 5px rgba(210, 184, 255, 0.2)) drop-shadow(0 0 10px rgba(210, 184, 255, 0.2)); }
            50% { filter: drop-shadow(0 0 10px rgba(210, 184, 255, 0.5)) drop-shadow(0 0 20px rgba(210, 184, 255, 0.3)); }
            100% { filter: drop-shadow(0 0 5px rgba(210, 184, 255, 0.2)) drop-shadow(0 0 10px rgba(210, 184, 255, 0.2)); }
        }
        .animate-neon-pulse {
            animation: neonPulse 3s infinite;
        }
    </style>

<body class="h-screen w-full flex items-center justify-center overflow-hidden font-body-base text-body-base">
<!-- Decorative background elements -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[40vw] text-secondary">
            engineering
        </span>
</div>
<!-- Neon Accent Gradients (Subtle) -->
<div class="absolute top-0 left-0 w-1/3 h-1/3 bg-primary-fixed/5 blur-[100px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-1/3 h-1/3 bg-secondary/5 blur-[100px] rounded-full pointer-events-none"></div>
<div class="scanlines"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[600px] px-margin-mobile md:px-margin-desktop">
<!-- Glassmorphic Maintenance Panel -->
<div class="glass-panel p-xl flex flex-col items-center text-center brutal-shadow">
<!-- Warning Icon Container -->
<div class="w-24 h-24 mb-lg flex items-center justify-center border-2 border-secondary bg-surface-container-low brutal-shadow">
<span class="material-symbols-outlined text-[48px] text-secondary animate-neon-pulse" style="font-variation-settings: 'FILL' 1;">
                    construction
                </span>
</div>
<!-- Headers -->
<div class="mb-md w-full border-b-2 border-outline-variant pb-md">
<h1 class="font-display-lg text-display-lg text-primary uppercase tracking-tighter hidden md:block">
                    NODE UNDER MAINTENANCE
                </h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tighter block md:hidden">
                    NODE UNDER MAINTENANCE
                </h1>
</div>
<!-- Description -->
<p class="font-body-base text-body-base text-on-surface-variant max-w-[400px] mb-xl leading-relaxed">
                This module is currently being optimized for high-frequency execution. Core systems are temporarily offline for structural upgrades. Check back shortly, operator.
            </p>
<!-- Technical Status Mini-Grid -->
<div class="grid grid-cols-2 gap-sm w-full max-w-[400px] mb-xl">
<div class="bg-surface-container-low p-sm brutal-border flex flex-col items-start">
<span class="font-label-caps text-label-caps text-secondary uppercase mb-xs">Status Code</span>
<span class="font-stat-lg text-stat-lg text-primary">503</span>
</div>
<div class="bg-surface-container-low p-sm brutal-border flex flex-col items-start">
<span class="font-label-caps text-label-caps text-secondary uppercase mb-xs">Est. Resolution</span>
<span class="font-stat-lg text-stat-lg text-primary">T-15M</span>
</div>
</div>
<!-- Return Action -->
<button class="bg-primary-fixed text-on-primary-fixed border-2 border-black font-body-bold text-body-bold px-xl py-md w-full max-w-[400px] flex items-center justify-center gap-sm brutal-shadow-accent hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_#c3f400] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none transition-all uppercase tracking-wide">
<span class="material-symbols-outlined">terminal</span>

</div>
